<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Support - Anima Clip</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 24px 16px 96px 16px;
      color: #333;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }
    .container {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      max-width: 600px;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }
    h2 {
      margin-top: 0;
      color: #1a73e8;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #444;
    }
    input, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-submit:disabled {
      background-color: #9ac1f6;
    }
    .status-alert {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }
    .status-alert.success {
      background-color: #e6f4ea;
      color: #137333;
    }
    .status-alert.error {
      background-color: #fde8e8;
      color: #c5221f;
    }

    .nav-buttons-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.15s;
    }
    .nav-btn-primary {
      background-color: #e8f0fe;
      color: #1a73e8;
      border: 1px solid #c2e7ff;
    }
    .nav-btn-primary:hover {
      background-color: #d2e3fc;
      transform: translateY(-1px);
    }
    .nav-btn-secondary {
      background-color: #f1f3f4;
      color: #3c4043;
      border: 1px solid #dadce0;
    }
    .nav-btn-secondary:hover {
      background-color: #e8eaed;
      transform: translateY(-1px);
    }

    .ai-fab-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border: none;
      border-radius: 50%;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.42);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      color: #ffffff;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s;
    }
    .ai-fab-btn:hover {
      transform: scale(1.1) rotate(-4deg);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.55);
    }
    .ai-fab-btn svg {
      width: 30px;
      height: 30px;
    }

    .ai-chat-window {
      display: none;
      position: fixed;
      bottom: 92px;
      right: 24px;
      width: 340px;
      max-width: calc(100vw - 32px);
      height: 460px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.16);
      z-index: 1000;
      flex-direction: column;
      overflow: hidden;
    }
    .ai-chat-header {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ai-chat-close {
      background: transparent;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .ai-chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f8fafc;
      font-size: 13.5px;
    }
    .chat-bubble {
      padding: 9px 13px;
      border-radius: 12px;
      line-height: 1.45;
      max-width: 82%;
      word-break: break-word;
      white-space: pre-line;
    }
    .chat-bubble.bot {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      align-self: flex-start;
      color: #1e293b;
    }
    .chat-bubble.user {
      background: #6366f1;
      color: #ffffff;
      align-self: flex-end;
    }
    .chat-bubble.loading {
      font-style: italic;
      color: #888;
      background: #f1f5f9;
      align-self: flex-start;
    }
    .ai-chat-footer {
      display: flex;
      padding: 10px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      gap: 8px;
    }
    .ai-chat-input {
      flex: 1;
      margin-bottom: 0;
      padding: 8px 12px;
      font-size: 13.5px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }
    .ai-chat-send {
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Contact Support</h2>
    <p class="subtitle">Have questions or found a bug? Send a message to Incrible Studio.</p>

    <form id="contactForm">
      <div class="form-group">
        <label for="userName">Your Name</label>
        <input type="text" id="userName" placeholder="e.g. Alex" required>
      </div>

      <div class="form-group">
        <label for="userEmail">Your Email Address</label>
        <input type="email" id="userEmail" placeholder="e.g. alex@example.com" required>
      </div>

      <div class="form-group">
        <label for="ticketSubject">Subject (Optional)</label>
        <input type="text" id="ticketSubject" placeholder="e.g. Export issue on Layer 3">
      </div>

      <div class="form-group">
        <label for="ticketMessage">Message</label>
        <textarea id="ticketMessage" placeholder="Describe what you need help with..." required></textarea>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmitTicket">Send Message</button>
    </form>

    <div id="contactStatus" class="status-alert"></div>

    <div class="nav-buttons-bar">
      <a href="community.html" class="nav-btn nav-btn-primary">💬 Community Q&A</a>
      <a href="index.html" class="nav-btn nav-btn-secondary">🏠 Home</a>
    </div>
  </div>

  <button class="ai-fab-btn" id="aiChatToggle" title="Chat with Anima Clip Bot" aria-label="Open AI Assistant">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v3" stroke-width="2"/>
      <circle cx="12" cy="2" r="1" fill="currentColor"/>
      <rect x="4" y="5" width="16" height="13" rx="5" stroke-width="1.8"/>
      <circle cx="8.5" cy="10" r="1.3" fill="currentColor" stroke="none"/>
      <circle cx="15.5" cy="10" r="1.3" fill="currentColor" stroke="none"/>
      <path d="M9.5 13.8c.8.9 1.7 1.2 2.5 1.2s1.7-.3 2.5-1.2" stroke-width="1.8"/>
      <path d="M2.5 10.5v2M21.5 10.5v2" stroke-width="2"/>
    </svg>
  </button>

  <div class="ai-chat-window" id="aiChatWindow">
    <div class="ai-chat-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <svg viewBox="0 0 24 24" style="width:20px; height:20px;" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v3"/>
          <circle cx="12" cy="2" r="1" fill="#fff"/>
          <rect x="4" y="5" width="16" height="13" rx="5"/>
          <circle cx="8.5" cy="10" r="1.3" fill="#fff" stroke="none"/>
          <circle cx="15.5" cy="10" r="1.3" fill="#fff" stroke="none"/>
          <path d="M9.5 13.8c.8.9 1.7 1.2 2.5 1.2s1.7-.3 2.5-1.2"/>
        </svg>
        <span>Anima Clip Bot</span>
      </div>
      <button class="ai-chat-close" id="aiChatClose">&times;</button>
    </div>
    <div class="ai-chat-messages" id="aiChatMessages">
      <div class="chat-bubble bot">
        Hi! I'm your Anima Clip Bot. How can I help you with your animation project, tools, or layers today?
      </div>
    </div>
    <div class="ai-chat-footer">
      <input type="text" class="ai-chat-input" id="aiChatInput" placeholder="Ask about tools, layers, export..." maxlength="500">
      <button class="ai-chat-send" id="aiChatSend">Send</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const DEV_NOTIFICATION_EMAIL = "Incriblestudiodeveloper@gmail.com";
    const WORKER_AI_URL = "https://anima-clip-bot.incriblestudio.workers.dev";

    const firebaseConfig = {
      apiKey: "AIzaSyDzQo1HsYJwdcwOJFo2xd8P347PXgw3COE",
      authDomain: "anima-clip-support.firebaseapp.com",
      projectId: "anima-clip-support",
      storageBucket: "anima-clip-support.firebasestorage.app",
      messagingSenderId: "998194247470",
      appId: "1:998194247470:web:9bfb771ce9356dcf3d2597",
      measurementId: "G-7QKLY9KODR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const contactForm = document.getElementById('contactForm');
    const btn = document.getElementById('btnSubmitTicket');
    const statusBox = document.getElementById('contactStatus');

    contactForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.innerText = 'Sending...';

      const name = document.getElementById('userName').value.trim();
      const email = document.getElementById('userEmail').value.trim();
      const subject = document.getElementById('ticketSubject').value.trim() || 'New Support Request';
      const message = document.getElementById('ticketMessage').value.trim();

      try {
        // 1. Save directly to Firebase first so inquiries are never dropped
        await addDoc(collection(db, "contact_submissions"), {
          name,
          email,
          subject,
          message,
          createdAt: serverTimestamp()
        });

        // 2. Dispatch email notification in background
        try {
          await fetch(`https://formsubmit.co/ajax/${DEV_NOTIFICATION_EMAIL}`, {
            method: "POST",
            headers: { 
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              name: name,
              email: email,
              _subject: `[Anima Clip Support] ${subject}`,
              message: message
            })
          });
        } catch (mailErr) {
          console.warn("FormSubmit notification had an issue, but ticket is logged in Firestore:", mailErr);
        }

        contactForm.reset();
        statusBox.className = 'status-alert success';
        statusBox.innerText = '✓ Message sent! Developer will review and email you back.';
        statusBox.style.display = 'block';
      } catch (err) {
        statusBox.className = 'status-alert error';
        statusBox.innerText = '⚠️ Failed to send message. Please try again.';
        statusBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Send Message';
      }
    });

    function cleanFormatting(str) {
      if (!str) return '';
      let clean = str;
      clean = clean.replace(/&lt;br\s*\/?&gt;/gi, '\n');
      clean = clean.replace(/<br\s*[\/]?>/gi, '\n');
      clean = clean.replace(/\*\*(.*?)\*\*/g, '$1');
      clean = clean.replace(/\*(.*?)\*/g, '$1');
      clean = clean.replace(/#{1,6}\s?/g, '');
      return clean.trim();
    }

    const aiChatToggle = document.getElementById('aiChatToggle');
    const aiChatWindow = document.getElementById('aiChatWindow');
    const aiChatClose = document.getElementById('aiChatClose');
    const aiChatInput = document.getElementById('aiChatInput');
    const aiChatSend = document.getElementById('aiChatSend');
    const aiChatMessages = document.getElementById('aiChatMessages');

    aiChatToggle.onclick = () => {
      const isVisible = aiChatWindow.style.display === 'flex';
      aiChatWindow.style.display = isVisible ? 'none' : 'flex';
      if (!isVisible) aiChatInput.focus();
    };

    aiChatClose.onclick = () => {
      aiChatWindow.style.display = 'none';
    };

    async function sendDirectAiMessage() {
      const question = aiChatInput.value.trim();
      if (!question) return;

      const userBubble = document.createElement('div');
      userBubble.className = 'chat-bubble user';
      userBubble.textContent = question;
      aiChatMessages.appendChild(userBubble);

      aiChatInput.value = '';
      aiChatInput.disabled = true;
      aiChatSend.disabled = true;

      const loadingBubble = document.createElement('div');
      loadingBubble.className = 'chat-bubble loading';
      loadingBubble.textContent = 'Bot is typing...';
      aiChatMessages.appendChild(loadingBubble);
      aiChatMessages.scrollTop = aiChatMessages.scrollHeight;

      try {
        const res = await fetch(WORKER_AI_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        
        loadingBubble.remove();
        const botBubble = document.createElement('div');
        botBubble.className = 'chat-bubble bot';
        botBubble.textContent = cleanFormatting(data.reply || "Sorry, I could not process your query right now.");
        aiChatMessages.appendChild(botBubble);
      } catch (err) {
        loadingBubble.remove();
        const errBubble = document.createElement('div');
        errBubble.className = 'chat-bubble bot';
        errBubble.textContent = "Connection issue. Please try again in a moment.";
        aiChatMessages.appendChild(errBubble);
      } finally {
        aiChatInput.disabled = false;
        aiChatSend.disabled = false;
        aiChatInput.focus();
        aiChatMessages.scrollTop = aiChatMessages.scrollHeight;
      }
    }

    aiChatSend.onclick = sendDirectAiMessage;
    aiChatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendDirectAiMessage();
    });
  </script>
</body>
</html>
