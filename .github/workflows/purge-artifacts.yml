name: Purge All Artifacts

on:
  workflow_dispatch:

jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete all repository artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/artifacts" \
            --jq '.artifacts[].id' | \
            xargs -r -I {} -P 4 gh api --method DELETE "/repos/$REPO/actions/artifacts/{}"
