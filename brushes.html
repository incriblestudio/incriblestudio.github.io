<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Brushes - Anima Clip</title>
  <meta name="description" content="Download custom brush packs for Anima Clip." />

  <!-- Browser Tab Favicon & Mobile Bookmark Icon -->
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="shortcut icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />

  <!-- Social Sharing Link Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://incriblestudio.github.io/brushes.html" />
  <meta property="og:title" content="Custom Brushes - Anima Clip" />
  <meta property="og:description" content="Download custom brush packs for Anima Clip." />
  <meta property="og:image" content="https://incriblestudio.github.io/logo.png" />
  <meta property="og:image:secure_url" content="https://incriblestudio.github.io/logo.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="1024" />

  <!-- Twitter / X Card Preview -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Custom Brushes - Anima Clip" />
  <meta name="twitter:description" content="Download custom brush packs for Anima Clip." />
  <meta name="twitter:image" content="https://incriblestudio.github.io/logo.png" />

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface-card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; }

    .container { max-width: 960px; margin: 0 auto; padding: 0 1.5rem; }

    .top-nav {
      padding: 1.75rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 1.25rem;
    }

    .app-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      object-fit: cover;
      background-color: #fff;
    }

    .nav-back {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--primary); }

    .brush-hero {
      text-align: center;
      padding: 3.5rem 0 2.5rem;
    }
    .badge {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      padding: 0.35rem 0.95rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .brush-hero h1 {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.75rem;
    }
    .brush-hero p {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    .brushes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 1.75rem;
      margin-bottom: 5rem;
    }

    .brush-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .brush-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .brush-art-header {
      width: 100%;
      height: 190px;
      background-color: #f1f5f9;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      display: none;
    }
    .brush-art-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brush-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .brush-tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--primary);
      margin-bottom: 0.35rem;
      display: inline-block;
    }

    .brush-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.45rem;
      line-height: 1.35;
    }

    .brush-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .btn-download-brush {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-download-brush:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem 0 3.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .copyright { color: var(--text-muted); }
    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 1.25rem;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--text); }

    @media (max-width: 600px) {
      footer { flex-direction: column; text-align: center; gap: 1.25rem; }
      .footer-links a { margin: 0 0.6rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="top-nav">
      <a href="index.html" class="brand-link">
        <img src="logo.png" alt="Anima Clip Logo" class="app-logo" />
        <span>Anima Clip</span>
      </a>
      <a href="index.html" class="nav-back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Home</span>
      </a>
    </header>

    <main>
      <section class="brush-hero">
        <span class="badge">Asset Library</span>
        <h1>Custom Brush Packs</h1>
        <p>Handcrafted brush collections, textures, and ink sets ready to download and import into Anima Clip.</p>
      </section>

      <section class="brushes-grid" id="brush-container">
        <p style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">Loading brush packs...</p>
      </section>
    </main>

    <footer>
      <p class="copyright">&copy; 2026 Incrible Studio. All rights reserved.</p>
      <div class="footer-links">
        <a href="contact.html">Support</a>
        <a href="https://sites.google.com/view/anima-clip-privacy-policy/home?pli=1&authuser=0" target="_blank" rel="noopener">Privacy Policy</a>
        <a href="/app-ads.txt">app-ads.txt</a>
      </div>
    </footer>
  </div>

  <script>
    const GITHUB_USER = "incriblestudio";
    const GITHUB_REPO = "incriblestudio.github.io";
    const API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/brushes`;

    async function loadBrushesAuto() {
      const container = document.getElementById('brush-container');
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("Could not fetch folder");
        const files = await response.json();

        const brushFiles = files.filter(f => f.type === 'file' && !f.name.startsWith('.'));

        if (brushFiles.length === 0) {
          container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">No brush packs available yet.</p>';
          return;
        }

        container.innerHTML = brushFiles.map((file, index) => {
          const rawBaseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
          const displayTitle = rawBaseName.replace(/[-_]/g, ' ');
          const encodedBase = encodeURIComponent(rawBaseName);

          return `
            <article class="brush-card">
              <div class="brush-art-header" id="art-header-${index}">
                <img src="images/${encodedBase}.png" 
                     alt="${displayTitle} Artwork" 
                     class="brush-art-img"
                     onload="this.parentElement.style.display='block';"
                     onerror="
                       if (this.src.endsWith('.png')) {
                         this.src = 'images/${encodedBase}.jpg';
                       } else if (this.src.endsWith('.jpg')) {
                         this.src = 'images/${encodedBase}.jpeg';
                       } else if (this.src.endsWith('.jpeg')) {
                         this.src = 'images/${encodedBase}.webp';
                       } else {
                         this.parentElement.style.display='none';
                       }
                     ">
              </div>
              <div class="brush-body">
                <div>
                  <span class="brush-tag">Brush Pack (.zip)</span>
                  <h2 class="brush-title">${displayTitle}</h2>
                  <p class="brush-desc">Curated texture and stroke collection for Anima Clip. Download the pack and extract presets into your canvas tool.</p>
                </div>
                <a href="${file.download_url || file.path}" class="btn-download-brush" download>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                  <span>Download Pack (.zip)</span>
                </a>
              </div>
            </article>
          `;
        }).join('');

      } catch (err) {
        container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">Unable to load brush packs.</p>';
      }
    }

    loadBrushesAuto();
  </script>
</body>
</html>
